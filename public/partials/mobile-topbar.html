<header class="app-topbar">
  <button class="app-brand-btn" type="button" data-logo-home id="logoHomeBtn" aria-label="MowNWA – go to homepage">
    <img src="/assets/brand/mownwa-logo-desktop.png" alt="MowNWA logo" class="app-brand-logo">
  </button>
  <span id="mobileViewTitle" class="topbar-view-chip"></span>
  <div class="app-topbar-actions">
    <a class="app-icon-btn app-topbar-contact-btn" href="tel:4792740412" aria-label="Call or text MowNWA">
      <img src="/assets/icons/lucide/phone.svg" alt="" class="ui-icon">
    </a>
    <button class="btn primary ui-icon-btn app-topbar-quote-btn" type="button" data-jump-view="quote" aria-label="Get My Lawn Quote">
      <img src="/assets/icons/lucide/calculator.svg" alt="" class="ui-icon">
      <span class="ui-label">Get My Lawn Quote</span>
    </button>
    <button class="btn secondary admin-only-nav ui-icon-btn app-topbar-admin-btn" type="button" data-jump-view="admin" style="display:none" aria-label="Admin">
      <img src="/assets/icons/lucide/shield.svg" alt="" class="ui-icon">
      <span class="ui-label">Admin</span>
    </button>
    <button class="app-icon-btn app-topbar-desktop-auth" id="openAuth" type="button" aria-label="Login or sign up" aria-haspopup="dialog">
      <img src="/assets/icons/lucide/user.svg" alt="" class="ui-icon">
      <span class="ui-label">Login</span>
    </button>
    <button class="app-icon-btn" id="mobileAuthBtn" type="button" aria-label="Login or sign up" aria-haspopup="dialog">
      <span id="mobileAccountAvatar" class="account-avatar compact" aria-hidden="true">
        <img data-avatar-img alt="" hidden />
        <span data-avatar-initials>G</span>
      </span>
      <span id="mobileAuthLabel" class="mobile-auth-label">Login</span>
    </button>
    <button class="app-icon-btn" id="openAppDrawer" type="button" aria-label="Open menu" aria-controls="appDrawer" aria-expanded="false">
      <img src="/assets/icons/lucide/settings.svg" alt="" class="ui-icon">
    </button>
  </div>
</header>
