<div id="appDrawerOverlay" class="drawer-overlay hidden"></div>
<aside id="appDrawer" class="app-drawer hidden" aria-label="More menu">
  <div class="drawer-head">
    <div>
      <strong>MowNWA</strong>
      <span>Northwest Arkansas lawn care</span>
    </div>
    <button class="app-icon-btn" id="closeAppDrawer" type="button" aria-label="Close menu">
      <img src="/assets/icons/lucide/x.svg" alt="" class="ui-icon">
    </button>
  </div>

  <!-- GET SERVICE — always visible -->
  <div class="drawer-section">
    <h4 class="drawer-section-label">Get Service</h4>
    <button type="button" data-drawer-view="quote" class="drawer-btn ui-icon-btn">
      <img src="/assets/icons/lucide/calculator.svg" alt="" class="ui-icon drawer-icon">
      <span class="ui-label">Get Lawn Quote</span>
    </button>
  </div>

  <!-- MY ACCOUNT — shown only when logged in -->
  <div class="drawer-section customer-logged-in-nav" style="display:none">
    <h4 class="drawer-section-label">My Account</h4>
    <div class="drawer-account-summary">
      <span id="drawerAccountAvatar" class="account-avatar" aria-hidden="true">
        <img data-avatar-img alt="" hidden />
        <span data-avatar-initials>G</span>
      </span>
      <span>
        <strong id="drawerAccountName">Account</strong>
        <small id="drawerAccountMeta"></small>
      </span>
    </div>
    <button type="button" onclick="showAccountPanel('quotes')" class="drawer-btn ui-icon-btn">
      <img src="/assets/icons/lucide/calculator.svg" alt="" class="ui-icon drawer-icon">
      <span class="ui-label">My Quotes</span>
    </button>
    <button type="button" onclick="showAccountPanel('jobs')" class="drawer-btn ui-icon-btn">
      <img src="/assets/icons/lucide/clipboard-check.svg" alt="" class="ui-icon drawer-icon">
      <span class="ui-label">My Jobs</span>
    </button>
    <button type="button" data-account-panel class="drawer-btn ui-icon-btn">
      <img src="/assets/icons/lucide/user.svg" alt="" class="ui-icon drawer-icon">
      <span class="ui-label">Account Settings</span>
    </button>
    <button type="button" id="drawerLogoutBtn" class="drawer-btn ui-icon-btn">
      <img src="/assets/icons/lucide/log-out.svg" alt="" class="ui-icon drawer-icon">
      <span class="ui-label">Sign Out</span>
    </button>
  </div>

  <!-- Provider — shown to provider or admin role -->
  <div class="drawer-section provider-only-nav" style="display:none">
    <h4 class="drawer-section-label">Provider</h4>
    <button type="button" data-drawer-view="providers" data-provider-section="dashboard" class="drawer-btn ui-icon-btn">
      <img src="/assets/icons/lucide/truck.svg" alt="" class="ui-icon drawer-icon">
      <span class="ui-label">Provider Dashboard</span>
    </button>
    <button type="button" data-drawer-view="providers" data-provider-section="jobs" class="drawer-btn ui-icon-btn"><img src="/assets/icons/lucide/clipboard-check.svg" alt="" class="ui-icon drawer-icon"><span class="ui-label">My Jobs</span></button>
    <button type="button" data-drawer-view="providers" data-provider-section="history" class="drawer-btn ui-icon-btn"><img src="/assets/icons/lucide/clock.svg" alt="" class="ui-icon drawer-icon"><span class="ui-label">Job History</span></button>
    <button type="button" data-drawer-view="providers" data-provider-section="services" class="drawer-btn ui-icon-btn"><img src="/assets/icons/lucide/wrench.svg" alt="" class="ui-icon drawer-icon"><span class="ui-label">Services</span></button>
    <button type="button" data-drawer-view="providers" data-provider-section="areas" class="drawer-btn ui-icon-btn"><img src="/assets/icons/lucide/map-pin.svg" alt="" class="ui-icon drawer-icon"><span class="ui-label">Service Areas</span></button>
    <button type="button" data-drawer-view="providers" data-provider-section="profile" class="drawer-btn ui-icon-btn"><img src="/assets/icons/lucide/user.svg" alt="" class="ui-icon drawer-icon"><span class="ui-label">Provider Profile</span></button>
    <button type="button" data-drawer-view="providers" data-provider-section="settings" class="drawer-btn ui-icon-btn"><img src="/assets/icons/lucide/settings.svg" alt="" class="ui-icon drawer-icon"><span class="ui-label">Settings</span></button>
  </div>

  <!-- Admin — shown to admin role only -->
  <div class="drawer-section admin-only-nav" style="display:none">
    <h4 class="drawer-section-label">Admin</h4>
    <button type="button" data-open-auth id="drawerAdminLogin" class="drawer-btn ui-icon-btn">
      <img src="/assets/icons/lucide/shield.svg" alt="" class="ui-icon drawer-icon">
      <span class="ui-label">Admin Login</span>
    </button>
    <button type="button" class="admin-only-nav drawer-btn ui-icon-btn" data-drawer-view="admin" data-scroll-target="adminRecentActivityPanel" style="display:none"><img src="/assets/icons/lucide/clipboard-check.svg" alt="" class="ui-icon drawer-icon"><span class="ui-label">Recent Activity</span></button>
    <button type="button" class="admin-only-nav drawer-btn ui-icon-btn" data-drawer-view="admin" data-scroll-target="adminRecentJobsPanel" style="display:none"><img src="/assets/icons/lucide/briefcase.svg" alt="" class="ui-icon drawer-icon"><span class="ui-label">Recent Jobs</span></button>
    <button type="button" class="admin-only-nav drawer-btn ui-icon-btn" data-drawer-view="admin" data-scroll-target="leadsPanel" style="display:none"><img src="/assets/icons/lucide/clipboard-list.svg" alt="" class="ui-icon drawer-icon"><span class="ui-label">Leads / Jobs</span></button>
    <button type="button" class="admin-only-nav drawer-btn ui-icon-btn" data-drawer-view="admin" data-scroll-target="adminControlsWrap" style="display:none"><img src="/assets/icons/lucide/settings.svg" alt="" class="ui-icon drawer-icon"><span class="ui-label">Pricing</span></button>
  </div>

  <!-- INFO — always visible -->
  <div class="drawer-section">
    <h4 class="drawer-section-label">Info</h4>
    <button type="button" data-drawer-view="dashboard" data-scroll-target="coverageGrid" class="drawer-btn ui-icon-btn">
      <img src="/assets/icons/lucide/map.svg" alt="" class="ui-icon drawer-icon">
      <span class="ui-label">Service Area</span>
    </button>
    <button type="button" data-drawer-contact class="drawer-btn ui-icon-btn">
      <img src="/assets/icons/lucide/mail.svg" alt="" class="ui-icon drawer-icon">
      <span class="ui-label">Contact</span>
    </button>
    <div id="drawerContactPanel" class="drawer-contact-panel" aria-label="Contact options">
      <a href="https://wa.me/1XXXXXXXXXX?text=Hi%20I%20have%20a%20question%20about%20my%20quote" target="_blank" rel="noopener" aria-label="Contact TurfLynk on WhatsApp">
        <svg class="contact-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12.04 2a9.9 9.9 0 0 0-8.46 15.02L2.4 21.6l4.69-1.12A9.93 9.93 0 1 0 12.04 2Zm0 1.85a8.08 8.08 0 1 1-4.14 15l-.3-.18-2.53.6.64-2.45-.2-.32a8.08 8.08 0 0 1 6.53-12.65Zm-3.55 4.4c-.18 0-.47.07-.72.34-.24.27-.94.92-.94 2.24s.97 2.6 1.1 2.78c.14.18 1.87 2.99 4.62 4.06 2.28.89 2.75.71 3.24.67.5-.05 1.6-.65 1.83-1.29.22-.63.22-1.17.16-1.28-.07-.12-.25-.18-.52-.32-.27-.13-1.6-.79-1.85-.88-.25-.09-.43-.13-.61.14-.18.26-.7.87-.86 1.05-.16.18-.32.2-.59.07-.27-.14-1.14-.42-2.17-1.34-.8-.71-1.34-1.6-1.5-1.86-.16-.27-.02-.42.12-.55.12-.12.27-.32.4-.47.14-.16.18-.27.27-.45.09-.18.05-.34-.02-.47-.07-.14-.61-1.47-.84-2.01-.22-.52-.45-.45-.61-.46h-.52Z"/>
        </svg>
        <span>WhatsApp</span>
      </a>
      <a href="https://m.me/YOUR_PAGE_NAME" target="_blank" rel="noopener" aria-label="Contact TurfLynk on Messenger">
        <svg class="contact-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2C6.48 2 2.25 6.03 2.25 11.47c0 2.84 1.16 5.3 3.04 7l-.63 3.34 3.39-1.86c1.17.43 2.5.67 3.95.67 5.52 0 9.75-4.03 9.75-9.47S17.52 2 12 2Zm1 12.75-2.5-2.66-4.88 2.66 5.35-5.67 2.56 2.66 4.81-2.66L13 14.75Z"/>
        </svg>
        <span>Messenger</span>
      </a>
    </div>
  </div>
</aside>
