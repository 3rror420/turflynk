<div id="appDrawerOverlay" class="drawer-overlay hidden"></div>
<aside id="appDrawer" class="app-drawer hidden" aria-label="More menu">
  <div class="drawer-head">
    <div>
      <strong>MowNWA</strong>
      <span>Northwest Arkansas lawn care</span>
    </div>
    <button class="app-icon-btn" id="closeAppDrawer" type="button" aria-label="Close menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>

  <!-- GET SERVICE — always visible -->
  <div class="drawer-section">
    <h4 class="drawer-section-label">Get Service</h4>
    <button type="button" data-drawer-view="quote" class="drawer-btn">
      <svg class="drawer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
      Get Lawn Quote
    </button>
  </div>

  <!-- SERVICES — always visible -->
  <div class="drawer-section">
    <h4 class="drawer-section-label">Services</h4>
    <button type="button" data-drawer-view="quote" data-service-type="mowing" class="drawer-btn">Mowing</button>
    <button type="button" data-drawer-view="quote" data-service-type="mowing_edging" class="drawer-btn">Mowing + Edging</button>
    <button type="button" data-drawer-view="quote" data-service-type="yard_cleanup" class="drawer-btn">Yard Cleanup</button>
    <button type="button" data-drawer-view="quote" data-service-type="leaf_cleanup" class="drawer-btn">Leaf Cleanup</button>
    <button type="button" data-drawer-view="quote" data-service-type="brush_cleanup" class="drawer-btn">Brush Cleanup</button>
  </div>

  <!-- MY ACCOUNT — shown only when logged in -->
  <div class="drawer-section customer-logged-in-nav" style="display:none">
    <h4 class="drawer-section-label">My Account</h4>
    <div class="drawer-account-summary">
      <span id="drawerAccountAvatar" class="account-avatar" aria-hidden="true">
        <img data-avatar-img alt="" hidden />
        <span data-avatar-initials>G</span>
      </span>
      <span>
        <strong id="drawerAccountName">Account</strong>
        <small id="drawerAccountMeta"></small>
      </span>
    </div>
    <button type="button" onclick="showAccountPanel('quotes')" class="drawer-btn">
      <svg class="drawer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      My Quotes
    </button>
    <button type="button" onclick="showAccountPanel('jobs')" class="drawer-btn">
      <svg class="drawer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/></svg>
      My Jobs
    </button>
    <button type="button" data-account-panel class="drawer-btn">
      <svg class="drawer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>
      Account Settings
    </button>
    <button type="button" id="drawerLogoutBtn" class="drawer-btn">
      <svg class="drawer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M21 19V5a2 2 0 00-2-2h-6"/></svg>
      Sign Out
    </button>
  </div>

  <!-- Provider — shown to provider or admin role -->
  <div class="drawer-section provider-only-nav" style="display:none">
    <h4 class="drawer-section-label">Provider</h4>
    <button type="button" data-drawer-view="providers" data-provider-section="dashboard" class="drawer-btn">
      <svg class="drawer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
      Provider Dashboard
    </button>
    <button type="button" data-drawer-view="providers" data-provider-section="jobs" class="drawer-btn">My Jobs</button>
    <button type="button" data-drawer-view="providers" data-provider-section="history" class="drawer-btn">Job History</button>
    <button type="button" data-drawer-view="providers" data-provider-section="services" class="drawer-btn">Services</button>
    <button type="button" data-drawer-view="providers" data-provider-section="areas" class="drawer-btn">Service Areas</button>
    <button type="button" data-drawer-view="providers" data-provider-section="profile" class="drawer-btn">Provider Profile</button>
    <button type="button" data-drawer-view="providers" data-provider-section="settings" class="drawer-btn">Settings</button>
  </div>

  <!-- Admin — shown to admin role only -->
  <div class="drawer-section admin-only-nav" style="display:none">
    <h4 class="drawer-section-label">Admin</h4>
    <button type="button" data-open-auth id="drawerAdminLogin" class="drawer-btn">
      <svg class="drawer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
      Admin Login
    </button>
    <button type="button" class="admin-only-nav drawer-btn" data-drawer-view="admin" data-scroll-target="adminRecentActivityPanel" style="display:none">Recent Activity</button>
    <button type="button" class="admin-only-nav drawer-btn" data-drawer-view="admin" data-scroll-target="adminRecentJobsPanel" style="display:none">Recent Jobs</button>
    <button type="button" class="admin-only-nav drawer-btn" data-drawer-view="admin" data-scroll-target="leadsPanel" style="display:none">Leads / Jobs</button>
    <button type="button" class="admin-only-nav drawer-btn" data-drawer-view="admin" data-scroll-target="adminControlsWrap" style="display:none">Pricing</button>
  </div>

  <!-- INFO — always visible -->
  <div class="drawer-section">
    <h4 class="drawer-section-label">Info</h4>
    <button type="button" data-drawer-view="dashboard" data-scroll-target="coverageGrid" class="drawer-btn">
      <svg class="drawer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 010 20M12 2a15.3 15.3 0 000 20"/></svg>
      Service Area
    </button>
    <button type="button" data-drawer-contact class="drawer-btn">
      <svg class="drawer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81a19.79 19.79 0 01-3.07-8.72A2 2 0 012 .82h3a2 2 0 012 1.72c.13 1.04.35 2.06.67 3.06a2 2 0 01-.45 2.11L6.09 8.91a16 16 0 006 6l1.2-1.2a2 2 0 012.11-.45c1 .32 2.02.55 3.06.67A2 2 0 0122 16.92z"/></svg>
      Contact
    </button>
    <div id="drawerContactPanel" class="drawer-contact-panel" aria-label="Contact options">
      <a href="https://wa.me/1XXXXXXXXXX?text=Hi%20I%20have%20a%20question%20about%20my%20quote" target="_blank" rel="noopener" aria-label="Contact TurfLynk on WhatsApp">
        <svg class="contact-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12.04 2a9.9 9.9 0 0 0-8.46 15.02L2.4 21.6l4.69-1.12A9.93 9.93 0 1 0 12.04 2Zm0 1.85a8.08 8.08 0 1 1-4.14 15l-.3-.18-2.53.6.64-2.45-.2-.32a8.08 8.08 0 0 1 6.53-12.65Zm-3.55 4.4c-.18 0-.47.07-.72.34-.24.27-.94.92-.94 2.24s.97 2.6 1.1 2.78c.14.18 1.87 2.99 4.62 4.06 2.28.89 2.75.71 3.24.67.5-.05 1.6-.65 1.83-1.29.22-.63.22-1.17.16-1.28-.07-.12-.25-.18-.52-.32-.27-.13-1.6-.79-1.85-.88-.25-.09-.43-.13-.61.14-.18.26-.7.87-.86 1.05-.16.18-.32.2-.59.07-.27-.14-1.14-.42-2.17-1.34-.8-.71-1.34-1.6-1.5-1.86-.16-.27-.02-.42.12-.55.12-.12.27-.32.4-.47.14-.16.18-.27.27-.45.09-.18.05-.34-.02-.47-.07-.14-.61-1.47-.84-2.01-.22-.52-.45-.45-.61-.46h-.52Z"/>
        </svg>
        <span>WhatsApp</span>
      </a>
      <a href="https://m.me/YOUR_PAGE_NAME" target="_blank" rel="noopener" aria-label="Contact TurfLynk on Messenger">
        <svg class="contact-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2C6.48 2 2.25 6.03 2.25 11.47c0 2.84 1.16 5.3 3.04 7l-.63 3.34 3.39-1.86c1.17.43 2.5.67 3.95.67 5.52 0 9.75-4.03 9.75-9.47S17.52 2 12 2Zm1 12.75-2.5-2.66-4.88 2.66 5.35-5.67 2.56 2.66 4.81-2.66L13 14.75Z"/>
        </svg>
        <span>Messenger</span>
      </a>
    </div>
  </div>
</aside>
